spring:
  application:
    name: smart-crop-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_crop
    username: smartcrop
    password: smartcrop

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
