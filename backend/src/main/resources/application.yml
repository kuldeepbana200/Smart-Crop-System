spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: smart-crop-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_crop
    username: smartcrop
    password: smartcrop

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG

app:
  market:
    provider: groq

  jwt:
    secret: smartcrop-dev-secret-key-2026-super-secure
    expiration-ms: 86400000

  risk-monitoring:
    enabled: true
    fixed-delay-ms: 3600000

  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}

  youtube:
    api-key: ${YOUTUBE_API_KEY:}
